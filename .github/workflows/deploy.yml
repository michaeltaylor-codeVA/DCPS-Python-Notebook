name: Build and publish the JupyterLite site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install build tools
        run: pip install -r requirements.txt
      - name: Bundle Python for the browser (no outside CDN needed)
        run: python scripts/prepare_site.py
      - name: Build the site
        run: jupyter lite build --contents content --output-dir dist
      - name: Check the Python kernel is included
        run: |
          python -c "import json,sys; c=json.load(open('dist/jupyter-lite.json'))['jupyter-config-data']; n=[e['name'] for e in c.get('federated_extensions',[])]; print(n); sys.exit(0 if '@jupyterlite/pyodide-kernel-extension' in n else 1)"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
